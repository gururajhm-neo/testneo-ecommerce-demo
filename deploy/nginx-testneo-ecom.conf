# Nginx reverse proxy for ecommerce demo on the same EC2 as main TestNeo.
# Domain: testneo-ecom.testneo.ai  →  frontend :3001 + API :9000
#
# DNS (at your domain registrar / Cloudflare for testneo.ai):
#   Type: A
#   Name: testneo-ecom
#   Value: 34.229.255.219   # this EC2 public IP
#   Proxy: DNS only (or enable SSL at Cloudflare later)
#
# Note: testneo.ai currently points to 82.25.106.236 (LiteSpeed).
# This subdomain MUST point at the EC2 IP above, not that LiteSpeed host,
# unless you reverse-proxy from LiteSpeed to EC2 instead.
#
# Install on EC2:
#   sudo cp deploy/nginx-testneo-ecom.conf /etc/nginx/sites-available/testneo-ecom
#   sudo ln -sf /etc/nginx/sites-available/testneo-ecom /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Optional HTTPS (after DNS works):
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d testneo-ecom.testneo.ai

server {
    listen 80;
    server_name testneo-ecom.testneo.ai;

    # API → FastAPI on 9000 (frontend calls /api/...)
    location /api/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenAPI / health without /api prefix (optional convenience)
    location ~ ^/(health|docs|openapi\.json|redoc) {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # UI → static/vite serve on 3001
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
